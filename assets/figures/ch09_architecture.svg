<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">vLLM 0.28.x layered architecture: from HTTP to a GPU kernel</title>
  <desc id="d">Eight-layer architecture diagram: Client, API Server, LLMEngine/EngineCore, Scheduler, KVCacheManager/BlockPool, Executor, Worker/ModelRunner, and model + AttentionBackend. The right column lists the vLLM source path and the course chapter for each layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>

  <text x="30" y="38" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">vLLM 0.28.x layered architecture: from HTTP to a GPU kernel</text>
  <text x="30" y="60" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7280">Data flows down; source paths on the right; arrow labels are the objects/functions passed between layers</text>

  <!-- Layer 1: Client -->
  <rect x="30" y="84" width="560" height="42" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="46" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Client (HTTP / OpenAI SDK)</text>
  <text x="46" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">curl / openai / httpx, streaming or not</text>
  <text x="610" y="102" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">— (not part of the vLLM repo)</text>
  <text x="610" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.10: client + smoke test</text>

  <!-- Layer 2: API Server -->
  <rect x="30" y="138" width="560" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="46" y="156" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">API Server (OpenAI-compatible layer)</text>
  <text x="46" y="172" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">routing / auth / validation / SSE streaming</text>
  <text x="610" y="156" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/entrypoints/openai/api_server.py</text>
  <text x="610" y="172" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.10: /v1/chat/completions ...</text>

  <!-- Layer 3: EngineCore -->
  <rect x="30" y="192" width="560" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="46" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">LLMEngine / AsyncLLM -&gt; EngineCore</text>
  <text x="46" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">request orchestration: Processor / OutputProcessor</text>
  <text x="610" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/v1/engine/llm_engine.py / core.py</text>
  <text x="610" y="226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.09: call chain + process boundary</text>

  <!-- Layer 4: Scheduler -->
  <rect x="30" y="246" width="560" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="46" y="264" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">Scheduler (request queues + token budget)</text>
  <text x="46" y="280" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">admission / prefill-decode mixing / preemption</text>
  <text x="610" y="264" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/v1/core/sched/scheduler.py</text>
  <text x="610" y="280" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.05/06: scheduler we hand-wrote</text>

  <!-- Layer 5: KVCacheManager -->
  <rect x="30" y="300" width="560" height="42" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="46" y="318" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#4C1D95">KVCacheManager / BlockPool (paged KV cache)</text>
  <text x="46" y="334" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">block allocation / prefix caching / recycling</text>
  <text x="610" y="318" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/v1/core/kv_cache_manager.py / block_pool.py</text>
  <text x="610" y="334" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#7C3AED">Ch.02/03/04: block manager we hand-wrote</text>

  <!-- Layer 6: Executor -->
  <rect x="30" y="354" width="560" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="46" y="372" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">Executor (process / Ray abstraction)</text>
  <text x="46" y="388" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">ship the batch to workers, collect model outputs</text>
  <text x="610" y="372" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/v1/executor/abstract.py</text>
  <text x="610" y="388" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.12: TP/PP/DP + communication</text>

  <!-- Layer 7: Worker / ModelRunner -->
  <rect x="30" y="408" width="560" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="46" y="426" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">Worker / ModelRunner (forward + sampling)</text>
  <text x="46" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">build batch / prepare tensors / sample tokens</text>
  <text x="610" y="426" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/v1/worker/gpu_worker.py / gpu_model_runner.py</text>
  <text x="610" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB">Ch.01/07/08: forward, quant, spec-decode</text>

  <!-- Layer 8: model + attention backend -->
  <rect x="30" y="462" width="560" height="42" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="46" y="480" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E">Model + AttentionBackend (PagedAttention kernel)</text>
  <text x="46" y="496" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">FlashAttention / FlashInfer / Triton, paged KV I/O</text>
  <text x="610" y="480" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">vllm/model_executor/models/ + vllm/v1/attention/backends/</text>
  <text x="610" y="496" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#B45309">Ch.03: paged attention (verify path per version)</text>

  <!-- arrows -->
  <g stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)">
    <line x1="310" y1="126" x2="310" y2="134"/>
    <line x1="310" y1="180" x2="310" y2="188"/>
    <line x1="310" y1="234" x2="310" y2="242"/>
    <line x1="310" y1="288" x2="310" y2="296"/>
    <line x1="310" y1="342" x2="310" y2="350"/>
    <line x1="310" y1="396" x2="310" y2="404"/>
    <line x1="310" y1="450" x2="310" y2="458"/>
  </g>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#6B7280">
    <text x="322" y="134">HTTP JSON</text>
    <text x="322" y="188">add_request()</text>
    <text x="322" y="242">schedule()</text>
    <text x="322" y="296">allocate_slots()</text>
    <text x="322" y="350">SchedulerOutput</text>
    <text x="322" y="404">execute_model()</text>
    <text x="322" y="458">forward / attention</text>
  </g>

  <rect x="30" y="508" width="900" height="44" rx="8" fill="#F3F4F6"/>
  <text x="44" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#374151">
    In the v1 engine, API Server and EngineCore run as two processes (ZMQ), and the Executor fans the batch out to one or more Workers.
  </text>
  <text x="44" y="544" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#374151">
    Paths follow the vLLM 0.28.x v1 layout; see 09.4 for the command-by-command verification recipe.
  </text>
</svg>
