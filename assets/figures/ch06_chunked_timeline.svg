<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ch06-title ch06-desc">
  <title id="ch06-title">Chunked prefill keeps decode moving during a long prompt</title>
  <desc id="ch06-desc">Top: a 2048-token prompt is prefilled in one step, so every decoder stalls for about 170 ms. Bottom: the same prompt is split into 512-token chunks; each chunk step is much shorter, so decoders keep producing tokens between chunks and the tail inter-token latency drops from 173 ms to 50 ms.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#FFFFFF"/>

  <g font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
    <text x="36" y="36" font-size="22" font-weight="700" fill="#111827">Chunked prefill: keep decode moving during a long prompt</text>
    <text x="36" y="58" font-size="14" fill="#6B7280">Blue = prefill, green = decode, red dashed = decode stalled. Same GPU and same arrivals in both panels.</text>

    <!-- ================= top: chunked prefill OFF ================= -->
    <text x="36" y="92" font-size="16" font-weight="700" fill="#111827">Chunked prefill OFF: one 2048-token prefill step (TPOT p95 = 173 ms)</text>
    <text x="250" y="112" font-size="12" fill="#EF4444">every decoder stalls while the whole prompt is prefilled</text>

    <text x="92" y="135" font-size="12" fill="#6B7280" text-anchor="end">long prompt</text>
    <text x="92" y="175" font-size="12" fill="#6B7280" text-anchor="end">short A</text>
    <text x="92" y="215" font-size="12" fill="#6B7280" text-anchor="end">short B</text>

    <!-- long prompt: one big prefill -->
    <rect x="250" y="120" width="420" height="26" rx="4" fill="#2563EB"/>
    <text x="460" y="138" font-size="12" fill="#FFFFFF" text-anchor="middle">prefill 2048 tokens = 170 ms</text>
    <rect x="670" y="120" width="150" height="26" rx="4" fill="#10B981"/>

    <!-- short A / B: decode stalls -->
    <rect x="100" y="160" width="150" height="26" rx="4" fill="#10B981"/>
    <rect x="250" y="160" width="420" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="460" y="178" font-size="11" fill="#EF4444" text-anchor="middle">decode stalled</text>
    <rect x="670" y="160" width="150" height="26" rx="4" fill="#10B981"/>

    <rect x="100" y="200" width="150" height="26" rx="4" fill="#10B981"/>
    <rect x="250" y="200" width="420" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="670" y="200" width="150" height="26" rx="4" fill="#10B981"/>

    <line x1="100" y1="248" x2="900" y2="248" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="884" y="264" font-size="12" fill="#6B7280">time</text>

    <!-- ================= bottom: chunked prefill ON ================= -->
    <text x="36" y="304" font-size="16" font-weight="700" fill="#111827">Chunked prefill ON: chunk = 512 tokens (TPOT p95 = 50 ms)</text>
    <text x="250" y="324" font-size="12" fill="#10B981">each step is a 512-token chunk; decoders squeeze in between chunks</text>

    <text x="92" y="347" font-size="12" fill="#6B7280" text-anchor="end">long prompt</text>
    <text x="92" y="387" font-size="12" fill="#6B7280" text-anchor="end">short A</text>
    <text x="92" y="427" font-size="12" fill="#6B7280" text-anchor="end">short B</text>

    <!-- long prompt: 4 chunks then decode -->
    <rect x="250" y="332" width="112" height="26" rx="4" fill="#2563EB"/>
    <text x="306" y="350" font-size="11" fill="#FFFFFF" text-anchor="middle">512</text>
    <rect x="378" y="332" width="112" height="26" rx="4" fill="#2563EB"/>
    <text x="434" y="350" font-size="11" fill="#FFFFFF" text-anchor="middle">512</text>
    <rect x="506" y="332" width="112" height="26" rx="4" fill="#2563EB"/>
    <text x="562" y="350" font-size="11" fill="#FFFFFF" text-anchor="middle">512</text>
    <rect x="634" y="332" width="112" height="26" rx="4" fill="#2563EB"/>
    <text x="690" y="350" font-size="11" fill="#FFFFFF" text-anchor="middle">512</text>
    <rect x="750" y="332" width="70" height="26" rx="4" fill="#10B981"/>

    <!-- short A / B: decode continues with short stalls -->
    <rect x="100" y="372" width="150" height="26" rx="4" fill="#10B981"/>
    <rect x="250" y="372" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="309" y="390" font-size="10" fill="#EF4444" text-anchor="middle">~50 ms</text>
    <rect x="368" y="372" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="376" y="372" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="494" y="372" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="502" y="372" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="620" y="372" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="628" y="372" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="746" y="372" width="74" height="26" rx="4" fill="#10B981"/>

    <rect x="100" y="412" width="150" height="26" rx="4" fill="#10B981"/>
    <rect x="250" y="412" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="368" y="412" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="376" y="412" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="494" y="412" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="502" y="412" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="620" y="412" width="8" height="26" rx="2" fill="#10B981"/>
    <rect x="628" y="412" width="118" height="26" rx="4" fill="#F3F4F6" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="746" y="412" width="74" height="26" rx="4" fill="#10B981"/>

    <line x1="100" y1="460" x2="900" y2="460" stroke="#D1D5DB" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="884" y="476" font-size="12" fill="#6B7280">time</text>

    <!-- legend -->
    <rect x="36" y="492" width="16" height="16" rx="3" fill="#2563EB"/>
    <text x="58" y="505" font-size="13" fill="#111827">prefill</text>
    <rect x="130" y="492" width="16" height="16" rx="3" fill="#10B981"/>
    <text x="152" y="505" font-size="13" fill="#111827">decode</text>
    <rect x="224" y="492" width="16" height="16" rx="3" fill="#F3F4F6" stroke="#EF4444" stroke-dasharray="4 3"/>
    <text x="246" y="505" font-size="13" fill="#111827">decode stalled</text>
    <text x="404" y="505" font-size="13" fill="#6B7280">Chunking trades about 3% prefill throughput for a 3.5x shorter decode stall</text>
  </g>
</svg>
