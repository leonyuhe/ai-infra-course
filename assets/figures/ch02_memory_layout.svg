<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">KV cache memory layout: two tensors per layer</title>
  <desc id="d">Each transformer layer owns a K tensor and a V tensor of shape (B, H, S, D). A new token appends one column to the S dimension. The memory formula is 2 x L x H x D x S x B x dtype bytes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#FFFFFF"/>

  <text x="36" y="44" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#111827">KV cache memory layout: two tensors per layer</text>
  <text x="36" y="70" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">One K tensor and one V tensor per layer, shape (B, H, S, D); decode appends one column to S</text>

  <!-- layers -->
  <text x="36" y="112" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">Layers (L = n_layer)</text>
  <g font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
    <rect x="36" y="128" width="250" height="58" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="52" y="152" font-size="14" font-weight="700" fill="#111827">Layer 0</text>
    <rect x="52" y="160" width="104" height="18" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="104" y="174" text-anchor="middle" font-size="11" fill="#1E3A8A">K (B,H,S,D)</text>
    <rect x="166" y="160" width="104" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="218" y="174" text-anchor="middle" font-size="11" fill="#4C1D95">V (B,H,S,D)</text>

    <rect x="36" y="196" width="250" height="58" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="52" y="220" font-size="14" font-weight="700" fill="#111827">Layer 1</text>
    <rect x="52" y="228" width="104" height="18" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="104" y="242" text-anchor="middle" font-size="11" fill="#1E3A8A">K</text>
    <rect x="166" y="228" width="104" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="218" y="242" text-anchor="middle" font-size="11" fill="#4C1D95">V</text>

    <text x="150" y="282" text-anchor="middle" font-size="16" fill="#6B7280">...</text>

    <rect x="36" y="296" width="250" height="58" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="52" y="320" font-size="14" font-weight="700" fill="#111827">Layer L-1</text>
    <rect x="52" y="328" width="104" height="18" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="104" y="342" text-anchor="middle" font-size="11" fill="#1E3A8A">K</text>
    <rect x="166" y="328" width="104" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="218" y="342" text-anchor="middle" font-size="11" fill="#4C1D95">V</text>
  </g>

  <!-- zoomed tensor -->
  <text x="330" y="112" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">One K tensor: rows = heads, columns = positions</text>
  <g font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
    <rect x="330" y="128" width="330" height="226" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
    <text x="345" y="150" font-size="12" fill="#6B7280">H (KV heads)</text>
    <text x="640" y="352" text-anchor="end" font-size="12" fill="#6B7280">S (positions)</text>
    <text x="345" y="368" font-size="12" fill="#6B7280">each cell = D values x dtype_bytes</text>
    <g fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4">
      <rect x="360" y="160" width="26" height="30"/><rect x="390" y="160" width="26" height="30"/><rect x="420" y="160" width="26" height="30"/><rect x="450" y="160" width="26" height="30"/><rect x="480" y="160" width="26" height="30"/>
      <rect x="360" y="196" width="26" height="30"/><rect x="390" y="196" width="26" height="30"/><rect x="420" y="196" width="26" height="30"/><rect x="450" y="196" width="26" height="30"/><rect x="480" y="196" width="26" height="30"/>
      <rect x="360" y="232" width="26" height="30"/><rect x="390" y="232" width="26" height="30"/><rect x="420" y="232" width="26" height="30"/><rect x="450" y="232" width="26" height="30"/><rect x="480" y="232" width="26" height="30"/>
      <rect x="360" y="268" width="26" height="30"/><rect x="390" y="268" width="26" height="30"/><rect x="420" y="268" width="26" height="30"/><rect x="450" y="268" width="26" height="30"/><rect x="480" y="268" width="26" height="30"/>
    </g>
    <rect x="516" y="160" width="26" height="30" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <rect x="516" y="196" width="26" height="30" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <rect x="516" y="232" width="26" height="30" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <rect x="516" y="268" width="26" height="30" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <line x1="548" y1="160" x2="572" y2="160" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="580" y="164" font-size="12" fill="#065F46">new token</text>
    <line x1="545" y1="330" x2="545" y2="306" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="560" y="312" font-size="12" fill="#1E3A8A">append here</text>
  </g>

  <!-- formula -->
  <rect x="700" y="128" width="224" height="120" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="716" y="156" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700" fill="#92400E">KV cache bytes</text>
  <text x="716" y="184" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">2 (K and V) x L x H x D</text>
  <text x="716" y="206" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">x S x B x dtype_bytes</text>
  <text x="716" y="234" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">H = KV heads (GQA), not Q heads</text>

  <!-- example -->
  <rect x="700" y="264" width="224" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="716" y="290" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Qwen3-8B (fp16)</text>
  <text x="716" y="312" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#111827">144 KiB per token</text>
  <text x="716" y="334" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#111827">32K x batch 32 = 144 GiB</text>

  <rect x="36" y="386" width="888" height="46" rx="8" fill="#F3F4F6"/>
  <text x="52" y="414" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">The cache is per request and per layer: with 200 requests of different lengths, reserving max_seq_len for each wastes 74% of the pool (chapter 03).</text>

  <rect x="36" y="448" width="888" height="46" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="52" y="476" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#991B1B">Two directions this chapter verifies: formula to tensor.nbytes, and tensor.nbytes back to S (both must match exactly).</text>
</svg>
