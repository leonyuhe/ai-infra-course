<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Roofline model: prefill and decode hit different walls</title>
  <desc id="d">Log-log plot: the diagonal is the bandwidth roof, the horizontal line is the compute roof. Decode sits in the memory-bound region on the left; prefill sits in the compute-bound region on the right.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>
  <text x="60" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Roofline: prefill and decode hit different walls</text>
  <text x="60" y="66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#6B7280">Y: achievable performance (TFLOP/s, log)   X: arithmetic intensity (FLOP/byte, log)</text>

  <!-- plot area -->
  <rect x="100" y="90" width="800" height="330" fill="#FAFAFA" stroke="#E5E7EB"/>

  <!-- feasible regions -->
  <polygon points="100,420 544,181 544,420" fill="#FEF2F2"/>
  <polygon points="544,181 900,181 900,420" fill="#ECFDF5"/>

  <!-- roofs -->
  <line x1="100" y1="420" x2="544" y2="181" stroke="#EF4444" stroke-width="3"/>
  <line x1="544" y1="181" x2="900" y2="181" stroke="#7C3AED" stroke-width="3"/>

  <!-- axes -->
  <line x1="100" y1="420" x2="912" y2="420" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ticks -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7280">
    <text x="100" y="440" text-anchor="middle">0.1</text>
    <text x="260" y="440" text-anchor="middle">1</text>
    <text x="420" y="440" text-anchor="middle">10</text>
    <text x="580" y="440" text-anchor="middle">100</text>
    <text x="740" y="440" text-anchor="middle">1000</text>
    <text x="900" y="440" text-anchor="middle">10000</text>
    <text x="80" y="424" text-anchor="end">0.1</text>
    <text x="80" y="334" text-anchor="end">1</text>
    <text x="80" y="244" text-anchor="end">10</text>
    <text x="80" y="154" text-anchor="end">100</text>
  </g>

  <!-- axis labels -->
  <text x="500" y="492" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#111827">Arithmetic intensity = FLOP / byte</text>
  <text x="46" y="255" text-anchor="middle" transform="rotate(-90 46 255)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#111827">Achievable performance (TFLOP/s)</text>

  <!-- roof labels -->
  <text x="150" y="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#991B1B" transform="rotate(-23 150 392)">Bandwidth roof: BW × AI</text>
  <text x="730" y="168" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5B21B6">Compute roof: peak FLOPS</text>

  <!-- decode point -->
  <circle cx="260" cy="352" r="9" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
  <text x="278" y="348" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#991B1B">decode (8B, fp16)</text>
  <text x="278" y="368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7F1D1D">AI ≈ 1, memory-bound</text>

  <!-- prefill point -->
  <circle cx="790" cy="181" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="790" y="214" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">prefill (T=2048)</text>
  <text x="790" y="234" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#047857">AI ≈ T, compute-bound</text>

  <!-- formulas -->
  <rect x="100" y="506" width="800" height="42" rx="8" fill="#F3F4F6"/>
  <text x="116" y="533" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#111827">
    decode tok/s ≈ BW ÷ (params × bytes/param)   |   prefill time ≈ 2 × params × T ÷ effective FLOPS
  </text>
</svg>
