<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <title>Training memory ledger for a 7B model: DDP, ZeRO-1/2/3 and LoRA</title>
  <desc>Mixed-precision Adam needs 16 bytes per parameter: fp16 params 2, fp16 gradients 2, fp32 master weights 4, Adam first and second moments 8. On 8 A100 80GB GPUs, DDP needs 112GB per GPU and does not fit; ZeRO-1 needs 38.5GB, ZeRO-2 26.3GB, ZeRO-3 14GB; LoRA trains about 0.5% of parameters and needs about 14.5GB per GPU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#FFFFFF"/>
  <g font-family="Inter, 'Noto Sans SC', 'DejaVu Sans', sans-serif">
    <text x="40" y="42" font-size="22" font-weight="700" fill="#111827">Training memory ledger: 7B model on 8x A100 80GB</text>
    <text x="40" y="68" font-size="13" fill="#6B7280">Mixed-precision Adam = fp16 params 2B + fp16 grads 2B + fp32 master 4B + Adam moments 8B = 16 B/param</text>

    <!-- axis: 1 GB = 4.4 px, origin x=230 -->
    <line x1="230" y1="100" x2="230" y2="345" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="230" y1="345" x2="770" y2="345" stroke="#D1D5DB" stroke-width="2"/>
    <g font-size="13" fill="#6B7280" text-anchor="middle">
      <text x="230" y="365">0</text>
      <text x="318" y="365">20</text>
      <text x="406" y="365">40</text>
      <text x="494" y="365">60</text>
      <text x="582" y="365">80</text>
      <text x="670" y="365">100</text>
      <text x="758" y="365">120 GB</text>
    </g>
    <line x1="582" y1="100" x2="582" y2="345" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="588" y="118" font-size="13" fill="#EF4444">A100 80GB limit</text>

    <!-- DDP 112GB -->
    <text x="220" y="146" font-size="13" text-anchor="end" fill="#111827">DDP</text>
    <rect x="230" y="128" width="62" height="30" fill="#2563EB"/>
    <rect x="292" y="128" width="62" height="30" fill="#F59E0B"/>
    <rect x="354" y="128" width="123" height="30" fill="#7C3AED"/>
    <rect x="477" y="128" width="246" height="30" fill="#9CA3AF"/>
    <text x="730" y="148" font-size="13" fill="#EF4444" font-weight="700">112 GB - does not fit</text>

    <!-- ZeRO-1 38.5GB -->
    <text x="220" y="196" font-size="13" text-anchor="end" fill="#111827">ZeRO-1</text>
    <rect x="230" y="178" width="62" height="30" fill="#2563EB"/>
    <rect x="292" y="178" width="62" height="30" fill="#F59E0B"/>
    <rect x="354" y="178" width="15" height="30" fill="#7C3AED"/>
    <rect x="369" y="178" width="31" height="30" fill="#9CA3AF"/>
    <text x="408" y="198" font-size="13" fill="#111827">38.5 GB</text>

    <!-- ZeRO-2 26.25GB -->
    <text x="220" y="246" font-size="13" text-anchor="end" fill="#111827">ZeRO-2</text>
    <rect x="230" y="228" width="62" height="30" fill="#2563EB"/>
    <rect x="292" y="228" width="8" height="30" fill="#F59E0B"/>
    <rect x="300" y="228" width="15" height="30" fill="#7C3AED"/>
    <rect x="315" y="228" width="31" height="30" fill="#9CA3AF"/>
    <text x="354" y="248" font-size="13" fill="#111827">26.3 GB</text>

    <!-- ZeRO-3 14GB -->
    <text x="220" y="296" font-size="13" text-anchor="end" fill="#111827">ZeRO-3</text>
    <rect x="230" y="278" width="8" height="30" fill="#2563EB"/>
    <rect x="238" y="278" width="8" height="30" fill="#F59E0B"/>
    <rect x="246" y="278" width="15" height="30" fill="#7C3AED"/>
    <rect x="261" y="278" width="31" height="30" fill="#9CA3AF"/>
    <text x="300" y="298" font-size="13" fill="#10B981" font-weight="700">14 GB - fits</text>

    <!-- LoRA 14.5GB -->
    <text x="220" y="330" font-size="13" text-anchor="end" fill="#111827">LoRA</text>
    <rect x="230" y="312" width="62" height="30" fill="#2563EB"/>
    <rect x="292" y="312" width="3" height="30" fill="#F59E0B"/>
    <text x="303" y="332" font-size="13" fill="#10B981" font-weight="700">14.5 GB (frozen base)</text>

    <!-- legend -->
    <rect x="230" y="386" width="14" height="14" fill="#2563EB"/>
    <text x="252" y="398" font-size="13" fill="#111827">fp16 params</text>
    <rect x="370" y="386" width="14" height="14" fill="#F59E0B"/>
    <text x="392" y="398" font-size="13" fill="#111827">fp16 grads</text>
    <rect x="510" y="386" width="14" height="14" fill="#7C3AED"/>
    <text x="532" y="398" font-size="13" fill="#111827">fp32 master weights</text>
    <rect x="700" y="386" width="14" height="14" fill="#9CA3AF"/>
    <text x="722" y="398" font-size="13" fill="#111827">Adam m / v</text>

    <text x="40" y="436" font-size="15" font-weight="700" fill="#111827">Read it: every colored segment must be physically resident on every GPU</text>
    <text x="40" y="460" font-size="13" fill="#6B7280">ZeRO-1 shards optimizer states, ZeRO-2 also shards grads, ZeRO-3 also shards params - at the cost of extra gathers.</text>
    <text x="40" y="482" font-size="13" fill="#6B7280">LoRA does not replicate 16 B/param: it trains about 0.5% of params and keeps the frozen base at 2 B/param.</text>
    <text x="40" y="504" font-size="13" fill="#6B7280">Note: model states only; real training also pays for activations (grow with batch x seq).</text>
  </g>
</svg>
