<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Where quantization error comes from: step size, outliers, and granularity</title>
  <desc id="d">Three panels. Panel one shows floating point values rounding to a uniform grid with step s. Panel two shows one outlier inflating the per-tensor step so small weights collapse to zero. Panel three shows per-channel and per-group scales giving each slice its own finer step.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#FFFFFF"/>
  <text x="40" y="40" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#111827">Where quantization error comes from</text>
  <text x="40" y="68" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">Symmetric absmax quantization: x_q = clamp(round(x / s), -qmax, qmax),  s = absmax / qmax,  qmax = 2^(b-1) - 1</text>

  <!-- panel 1 -->
  <rect x="40" y="92" width="264" height="196" rx="8" fill="#F3F4F6"/>
  <text x="56" y="120" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">1. Rounding error &lt;= s/2</text>
  <line x1="60" y1="200" x2="290" y2="200" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="64" y1="193" x2="64" y2="207"/>
    <line x1="94" y1="193" x2="94" y2="207"/>
    <line x1="124" y1="193" x2="124" y2="207"/>
    <line x1="154" y1="193" x2="154" y2="207"/>
    <line x1="184" y1="193" x2="184" y2="207"/>
    <line x1="214" y1="193" x2="214" y2="207"/>
    <line x1="244" y1="193" x2="244" y2="207"/>
    <line x1="274" y1="193" x2="274" y2="207"/>
  </g>
  <g fill="#2563EB">
    <circle cx="78" cy="170" r="5"/>
    <circle cx="140" cy="170" r="5"/>
    <circle cx="198" cy="170" r="5"/>
    <circle cx="258" cy="170" r="5"/>
  </g>
  <g stroke="#EF4444" stroke-width="1.4" stroke-dasharray="3,3">
    <line x1="78" y1="176" x2="64" y2="192"/>
    <line x1="140" y1="176" x2="150" y2="192"/>
    <line x1="198" y1="176" x2="206" y2="192"/>
    <line x1="258" y1="176" x2="268" y2="192"/>
  </g>
  <line x1="64" y1="216" x2="94" y2="216" stroke="#F59E0B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="79" y="234" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#B45309">step s</text>
  <text x="56" y="262" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">Every value snaps to a level; the</text>
  <text x="56" y="280" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">red distance is at most s/2.</text>

  <!-- panel 2 -->
  <rect x="332" y="92" width="296" height="196" rx="8" fill="#F3F4F6"/>
  <text x="348" y="120" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">2. per-tensor: one outlier, huge step</text>
  <g fill="#2563EB">
    <rect x="352" y="228" width="14" height="12"/>
    <rect x="372" y="224" width="14" height="16"/>
    <rect x="392" y="230" width="14" height="10"/>
    <rect x="412" y="226" width="14" height="14"/>
    <rect x="432" y="229" width="14" height="11"/>
    <rect x="452" y="225" width="14" height="15"/>
    <rect x="472" y="230" width="14" height="10"/>
    <rect x="492" y="227" width="14" height="13"/>
    <rect x="512" y="228" width="14" height="12"/>
  </g>
  <rect x="556" y="150" width="18" height="90" fill="#F59E0B"/>
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="348" y1="240" x2="612" y2="240"/>
    <line x1="348" y1="200" x2="612" y2="200"/>
    <line x1="348" y1="160" x2="612" y2="160"/>
  </g>
  <text x="565" y="142" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#B45309">absmax</text>
  <text x="348" y="260" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#B91C1C">Small weights collapse to 0: one 20x value</text>
  <text x="348" y="278" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">sets s, so every weight pays its price.</text>

  <!-- panel 3 -->
  <rect x="652" y="92" width="268" height="196" rx="8" fill="#F3F4F6"/>
  <text x="668" y="120" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">3. per-group: one step per slice</text>
  <rect x="668" y="140" width="108" height="86" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="790" y="140" width="108" height="86" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <g stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="668" y1="158" x2="776" y2="158"/>
    <line x1="668" y1="176" x2="776" y2="176"/>
    <line x1="668" y1="194" x2="776" y2="194"/>
    <line x1="668" y1="212" x2="776" y2="212"/>
  </g>
  <g stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="790" y1="158" x2="898" y2="158"/>
    <line x1="790" y1="176" x2="898" y2="176"/>
    <line x1="790" y1="194" x2="898" y2="194"/>
    <line x1="790" y1="212" x2="898" y2="212"/>
  </g>
  <text x="722" y="246" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#1E40AF">group 0: own s</text>
  <text x="844" y="246" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#065F46">group 1: own s</text>
  <text x="668" y="270" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#111827">Finer step, same bit budget:</text>
  <text x="668" y="286" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#065F46">group_size = 128 / 64 / 32.</text>

  <!-- formula bar -->
  <rect x="40" y="306" width="880" height="188" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="336" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="700" fill="#111827">The three error knobs</text>
  <text x="60" y="366" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#111827">1. Rounding: bounded by s/2, unavoidable for a given bit-width.</text>
  <text x="60" y="392" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#111827">2. Range: s = absmax / qmax, so one outlier inflates every quantized value.</text>
  <text x="60" y="418" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#111827">3. Granularity: per-tensor (1 scale) -> per-channel (1 per row) -> per-group (1 per g elements).</text>
  <text x="60" y="450" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">int4 has qmax = 7, so its step is 16x coarser than int8's: int8 tolerates per-tensor, int4 needs per-group.</text>
  <text x="60" y="476" font-family="Inter, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">Symmetric quantization keeps zero-point = 0; asymmetric adds a zero-point for skewed data.</text>
</svg>
