[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiinfra-course"
version = "0.1.0"
description = "AI Infra 从零构建：课程共享库与 Notebook"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["aiinfra*"]
