name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch first (avoid CUDA wheel on runner)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e .

      - name: Build notebooks (.py -> .ipynb)
        run: python tools/build_notebooks.py

      - name: Structural check
        run: python tools/check_notebooks.py --all

      - name: Shared library regression tests
        run: python tools/test_lib.py

      - name: Headless execute all 15 chapters
        run: python tools/execute_notebooks.py --all --timeout 600
